name: CI

on: # on action...
  pull_request:
  push:
    branches: [main]

jobs: # perform this work.
  check:
    runs-on: ubuntu-latest
    # Public values, stored as repository variables. The secret key never goes here.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: test ! -f pnpm-lock.yaml && test ! -f yarn.lock # npm only
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
